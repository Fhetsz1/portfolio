<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reviews — Fhetsz</title>
  <meta name="description" content="View client reviews and leave your own." />
  
  <!-- Custom Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⭐</text></svg>" />

  <!-- Links to your existing black & white stylesheet -->
  <link rel="stylesheet" href="style.css" />

  <style>
    /* ================= MARQUEE GALLERY ================= */
    .marquee-container {
      width: 100%;
      overflow: hidden;
      position: relative;
      padding: 1rem 0 2rem 0;
      margin-bottom: 3rem;
    }

    .marquee-track {
      display: flex;
      width: max-content;
      animation: scrollLeftToRight 40s linear infinite !important;
    }

    .marquee-track:hover {
      animation-play-state: paused !important;
    }

    /* Groups images so the math for the loop is perfectly seamless */
    .marquee-group {
      display: flex;
      gap: 1.5rem;
      padding-right: 1.5rem;
    }

    @keyframes scrollLeftToRight {
      0% { transform: translateX(-50%); }
      100% { transform: translateX(0); }
    }

    .gallery-item {
      width: 350px;
      flex-shrink: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: zoom-in;
      transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
    }

    .gallery-item:hover {
      transform: translateY(-4px);
      border-color: var(--border-bright);
      box-shadow: 0 12px 30px -10px rgba(255, 255, 255, 0.15);
    }

    .gallery-item img {
      width: 100%;
      height: 250px;
      object-fit: contain; /* Shows the FULL image without cropping */
      background: var(--bg);
      padding: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    .gallery-caption {
      padding: 1rem;
      font-size: 0.9rem;
      color: var(--text);
      text-align: center;
      background: var(--card-2);
    }

    /* Lightbox (Fullscreen Image Viewer) */
    #lightbox {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: rgba(5, 5, 5, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      backdrop-filter: blur(5px);
    }

    #lightbox.open {
      opacity: 1;
      pointer-events: auto;
    }

    #lightbox img {
      max-width: 90%;
      max-height: 85vh;
      border-radius: 12px;
      box-shadow: 0 0 50px rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>

  <header class="site-header">
    <a class="brand" href="index.html">Fhetsz<span>.</span></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="rules.html">Rules</a>
      <a href="reviews.html" class="active">Reviews</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section class="page-head">
      <p class="eyebrow">See what people say</p>
      <h1 class="page-title">Reviews</h1>
      <p class="muted">Hover to pause, click any photo to enlarge it.</p>
    </section>

    <!-- ================= PHOTO GALLERY (MARQUEE) ================= -->
    <section class="marquee-container">
      <div class="marquee-track">
        
        <!-- GROUP 1 (5 Reviews) -->
        <div class="marquee-group">
          <div class="gallery-item">
            <img src="images/Customer1.png" alt="Review 1" loading="lazy" />
            <div class="gallery-caption">Review 01</div>
          </div>
          <div class="gallery-item">
            <img src="images/Customer2.png" alt="Review 2" loading="lazy" />
            <div class="gallery-caption">Review 02</div>
          </div>
          <div class="gallery-item">
            <img src="images/Customer3.png" alt="Review 3" loading="lazy" />
            <div class="gallery-caption">Review 03</div>
          </div>
          <div class="gallery-item">
            <img src="images/Customer4.png" alt="Review 4" loading="lazy" />
            <div class="gallery-caption">Review 04</div>
          </div>
          <div class="gallery-item">
            <img src="images/Customer5.png" alt="Review 5" loading="lazy" />
            <div class="gallery-caption">Review 05</div>
          </div>
        </div>

        <!-- GROUP 2 (Duplicate of Group 1 for seamless loop) -->
        <div class="marquee-group">
          <div class="gallery-item">
            <img src="images/Customer1.png" alt="Review 1" loading="lazy" />
            <div class="gallery-caption">Review 01</div>
          </div>
          <div class="gallery-item">
            <img src="images/Customer2.png" alt="Review 2" loading="lazy" />
            <div class="gallery-caption">Review 02</div>
          </div>
          <div class="gallery-item">
            <img src="images/Customer3.png" alt="Review 3" loading="lazy" />
            <div class="gallery-caption">Review 03</div>
          </div>
          <div class="gallery-item">
            <img src="images/Customer4.png" alt="Review 4" loading="lazy" />
            <div class="gallery-caption">Review 04</div>
          </div>
          <div class="gallery-item">
            <img src="images/Customer5.png" alt="Review 5" loading="lazy" />
            <div class="gallery-caption">Review 05</div>
          </div>
        </div>

      </div>
    </section>

    <!-- ================= SUBMISSION FORM ================= -->
    <section class="card" style="margin-top: 2rem;">
      <h2 style="margin-bottom: 1.5rem;">Leave a review</h2>
      <form id="review-form" novalidate>
        <div class="field">
          <label for="rv-name">Your name</label>
          <input id="rv-name" type="text" maxlength="60" placeholder="e.g. Alex" autocomplete="name" required />
        </div>

        <div class="field">
          <label>Your rating</label>
          <div class="stars">
            <input type="radio" id="star5" name="rating" value="5" />
            <label for="star5" title="5 stars">★</label>
            <input type="radio" id="star4" name="rating" value="4" />
            <label for="star4" title="4 stars">★</label>
            <input type="radio" id="star3" name="rating" value="3" />
            <label for="star3" title="3 stars">★</label>
            <input type="radio" id="star2" name="rating" value="2" />
            <label for="star2" title="2 stars">★</label>
            <input type="radio" id="star1" name="rating" value="1" />
            <label for="star1" title="1 star">★</label>
          </div>
        </div>

        <div class="field">
          <label for="rv-text">Your review</label>
          <textarea id="rv-text" rows="5" maxlength="1000" placeholder="What was it like working with me?" required></textarea>
        </div>

        <div class="hp" aria-hidden="true">
          <label for="rv-website">Website</label>
          <input id="rv-website" type="text" tabindex="-1" autocomplete="off" />
        </div>

        <button id="submit-btn" class="btn btn-primary" type="submit">Send review</button>
        <p id="form-status" class="status" role="status"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> Fhetsz&rsquo;s Portfolio &mdash; built with GitHub Pages</p>
  </footer>

  <!-- Fullscreen Image Viewer -->
  <div id="lightbox">
    <img id="lb-img" src="" alt="Enlarged review" />
  </div>

  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
  <script src="config.js"></script>
  <script src="reviews.js"></script>
  <script src="effects.js"></script>

  <!-- Script for the Image Lightbox -->
  <script>
    const lightbox = document.getElementById('lightbox');
    const lbImg = document.getElementById('lb-img');
    
    document.querySelectorAll('.gallery-item').forEach(item => {
      item.addEventListener('click', () => {
        const img = item.querySelector('img');
        lbImg.src = img.src;
        lightbox.classList.add('open');
        document.body.style.overflow = 'hidden';
      });
    });

    lightbox.addEventListener('click', () => {
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
    });
  </script>
</body>
</html>
